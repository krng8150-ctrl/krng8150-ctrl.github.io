<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永翼天堂｜公告列表</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    color: #eef7ff;
    background: #07111f;
}

body {
    background: #07111f url("026AF631-4F86-4F4E-B158-561B2E193C5B.png") center top no-repeat;
    background-size: cover;
}

.wrapper {
    width: 100%;
    min-height: 100%;
    padding: 8px 14px;
    background: #07111f;
    background: rgba(7, 17, 31, 0.82);
}

h1 {
    margin: 0 0 6px;
    color: #e5f6ff;
    font-size: 17px;
    font-weight: normal;
    line-height: 1.3;
}

.notice-list {
    margin: 0;
    padding: 0;
    list-style: none;
}

.notice-list li {
    margin: 0;
    padding: 0;
    line-height: 1.45;
}

.notice-list a,
.notice-list .empty {
    display: block;
    width: 100%;
    padding: 2px 4px;
    font-size: 14px;
    line-height: 1.45;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.notice-list a {
    color: #eef7ff;
}

.notice-list a:hover,
.notice-list a:focus {
    color: #91deff;
    text-decoration: underline;
}

.date {
    color: #b6d8f2;
}

.latest {
    color: #8fe0ff;
}

.ended {
    color: #b8c2cc;
}

.notice-list .empty {
    color: #8499aa;
}

.more {
    margin: 7px 4px 0;
    font-size: 12px;
}

.more a {
    color: #a6d9ff;
    text-decoration: none;
}

.more a:hover,
.more a:focus {
    text-decoration: underline;
}

@media (max-width: 440px) {
    .wrapper {
        padding: 7px 8px;
    }

    h1 {
        font-size: 16px;
    }

    .notice-list a,
    .notice-list .empty {
        font-size: 13px;
    }
}
</style>
</head>

<body>
<div class="wrapper">
    <h1>永翼天堂｜最新公告</h1>

    <ul class="notice-list">
        <!-- 公告 1 -->
        <li>
            <a href="notice-download.html">
                <span class="date">[2026]</span>
                <span class="latest">最新公告</span> 古龍降臨・改版儲值活動
            </a>
        </li>

        <!-- 公告 2 -->
        <li>
            <a href="notice-open.html">
                <span class="date">[2026]</span>
                <span class="ended">已結束</span> 端午節儲值活動
            </a>
        </li>

        <!-- 公告 3～9：有新公告時，改成上面的 a 連結格式 -->
        <li><span class="empty">[--/--] 公告位置 3</span></li>
        <li><span class="empty">[--/--] 公告位置 4</span></li>
        <li><span class="empty">[--/--] 公告位置 5</span></li>
        <li><span class="empty">[--/--] 公告位置 6</span></li>
        <li><span class="empty">[--/--] 公告位置 7</span></li>
        <li><span class="empty">[--/--] 公告位置 8</span></li>
        <li><span class="empty">[--/--] 公告位置 9</span></li>
    </ul>

    <p class="more">
        <a href="index.html">前往官方網站查看完整資訊 ›</a>
    </p>
</div>
</body>
</html>
