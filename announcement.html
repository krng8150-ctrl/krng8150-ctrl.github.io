<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永翼天堂｜最新公告</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    background: #07111f;
    color: #eef7ff;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
}

body {
    background: #07111f
        url("026AF631-4F86-4F4E-B158-561B2E193C5B.png")
        center top no-repeat;
    background-size: cover;
}

.wrapper {
    width: 100%;
    min-height: 360px;
    padding: 0 10px;
    background: #102238;
    background: rgba(7, 17, 31, 0.55);
}

.layout {
    width: 100%;
    min-height: 360px;
    border-collapse: collapse;
    table-layout: fixed;
}

.left-panel,
.right-panel {
    width: 50%;
    padding: 10px 12px;
    vertical-align: top;
}

.left-panel {
    border-right: 2px solid #79b8d9;
}

h1 {
    margin: 0 0 8px;
    color: #e5f6ff;
    font-size: 17px;
    font-weight: normal;
    line-height: 1.4;
}

.notice-list {
    margin: 0;
    padding: 0;
    list-style: none;
}

.notice-list li {
    margin: 0;
    padding: 0;
}

.notice-list a,
.notice-list .empty {
    display: block;
    padding: 4px 0;
    font-size: 13px;
    line-height: 1.45;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.notice-list a {
    color: #eef7ff;
    text-decoration: none;
}

.notice-list a:hover,
.notice-list a:focus {
    color: #91deff;
    text-decoration: underline;
}

.date {
    color: #b6d8f2;
}

.latest {
    color: #8fe0ff;
}

.ended {
    color: #b8c2cc;
}

.empty {
    color: #8399ab;
}

.website-link {
    margin: 10px 0 0;
    font-size: 12px;
}

.website-link a,
.back-link {
    color: #a6d9ff;
    text-decoration: none;
}

.website-link a:hover,
.back-link:hover,
.back-link:focus {
    color: #ffffff;
    text-decoration: underline;
}

/* 點公告後顯示詳細內容 */
#detail-view {
    display: none;
    padding: 10px 4px;
}

.detail-header {
    margin: 0 0 8px;
    font-size: 14px;
}

#detail-frame {
    display: block;
    width: 100%;
    height: 330px;
    border: 0;
    background: #07111f;
}

@media (max-width: 700px) {
    .wrapper {
        padding: 0 6px;
    }

    .left-panel,
    .right-panel {
        padding: 8px 7px;
    }

    h1 {
        font-size: 15px;
    }

    .notice-list a,
    .notice-list .empty {
        padding: 4px 0;
        font-size: 12px;
    }
}
</style>

<script>
function openNotice() {
    document.getElementById("list-view").style.display = "none";
    document.getElementById("detail-view").style.display = "block";
}

function backToList() {
    document.getElementById("detail-view").style.display = "none";
    document.getElementById("list-view").style.display = "block";
    document.getElementById("detail-frame").src = "about:blank";
    return false;
}
</script>
</head>

<body>
<div class="wrapper">

    <!-- 左右兩欄公告列表 -->
    <div id="list-view">
        <table class="layout" role="presentation">
            <tr>
                <!-- 左邊：公告 1～8 -->
                <td class="left-panel">
                    <h1>永翼天堂｜最新公告</h1>

                    <ul class="notice-list">
                        <!-- 公告 1 -->
                        <li>
                            <a href="notice-download.html"
                               target="detail-frame"
                               onclick="openNotice()">
                                <span class="date">[2026]</span>
                                <span class="latest">最新公告</span>
                                古龍降臨・改版儲值活動
                            </a>
                        </li>

                        <!-- 公告 2 -->
                        <li>
                            <a href="notice-open.html"
                               target="detail-frame"
                               onclick="openNotice()">
                                <span class="date">[2026]</span>
                                <span class="ended">已結束</span>
                                端午節儲值活動
                            </a>
                        </li>

                        <!-- 公告 3～8：未來新增 -->
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                    </ul>

                    <p class="website-link">
                        <a href="https://www.yong-yi.uk/"
                           target="_blank"
                           rel="noopener noreferrer">
                            前往官方網站 ›
                        </a>
                    </p>
                </td>

                <!-- 右邊：公告 9～16 -->
                <td class="right-panel">
                    <h1>更多公告</h1>

                    <ul class="notice-list">
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                        <li><span class="empty">[--/--] 敬請期待</span></li>
                    </ul>
                </td>
            </tr>
        </table>
    </div>

    <!-- 公告內容與返回列表 -->
    <div id="detail-view">
        <p class="detail-header">
            <a class="back-link"
               href="announcement.html"
               onclick="return backToList();">
                ‹ 返回上一頁（公告列表）
            </a>
        </p>

        <iframe id="detail-frame"
                name="detail-frame"
                title="公告詳細內容"
                src="about:blank">
        </iframe>
    </div>

</div>
</body>
</html>
