<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永翼天堂｜公告列表</title>
<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    color: #eef7ff;
    background: #07111f;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
}

body {
    background: #07111f url("026AF631-4F86-4F4E-B158-561B2E193C5B.png") center top no-repeat;
    background-size: cover;
}

.wrapper {
    max-width: 1180px;
    margin: 0 auto;
    padding: 12px 16px;
    background: rgba(7, 17, 31, 0.90);
}

h1 {
    margin: 0 0 10px;
    font-size: 22px;
    font-weight: normal;
}

.notice-list {
    margin: 0;
    padding: 0;
    list-style: none;
}

.notice-list li {
    margin: 0;
    border-bottom: 1px solid #29445c;
}

.notice-list a {
    display: block;
    padding: 9px 6px;
    color: #eef7ff;
    text-decoration: none;
    line-height: 1.4;
}

.notice-list a:hover,
.notice-list a:focus {
    background: #18334d;
    color: #ffffff;
}

.date {
    display: inline-block;
    width: 58px;
    color: #bddcff;
    font-size: 14px;
    vertical-align: middle;
}

.tag {
    display: inline-block;
    width: 58px;
    color: #8fd8ff;
    font-size: 13px;
    vertical-align: middle;
}

.tag-ended {
    color: #b8c2cc;
}

.title {
    font-size: 16px;
    font-weight: bold;
    vertical-align: middle;
}

.more {
    margin: 12px 6px 0;
    font-size: 13px;
}

.more a {
    color: #a6d9ff;
}

@media (max-width: 440px) {
    .wrapper { padding: 10px; }
    .date { width: 53px; }
    .tag { width: 52px; }
    .title { font-size: 15px; }
}
</style>
</head>
<body>

<div class="wrapper">
    <h1>公告列表</h1>

    <ul class="notice-list">
        <li>
            <a href="notice-download.html">
                <span class="date">2026</span>
                <span class="tag">最新公告</span>
                <span class="title">古龍降臨・改版儲值活動</span>
            </a>
        </li>

        <li>
            <a href="notice-open.html">
                <span class="date">2026</span>
                <span class="tag tag-ended">已結束</span>
                <span class="title">端午節儲值活動</span>
            </a>
        </li>
    </ul>

    <p class="more">
        <a href="index.html">前往官方網站查看完整資訊 ›</a>
    </p>
</div>

</body>
</html>
