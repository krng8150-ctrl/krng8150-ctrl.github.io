<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永翼天堂｜公告列表</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    color: #eef7ff;
    background: #07111f;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
}

body {
    background: #07111f url("026AF631-4F86-4F4E-B158-561B2E193C5B.png") center top no-repeat;
    background-size: cover;
}

.wrapper {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px;
    background: #0a192b;
    background: rgba(7, 17, 31, 0.88);
}

h1 {
    margin: 0 4px 6px;
    color: #e4f5ff;
    font-size: 20px;
    font-weight: normal;
}

/* 三欄固定排列，適合登入器公告視窗 */
.notice-grid {
    width: 100%;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 5px;
}

.notice-grid td {
    width: 33.333%;
    padding: 0;
    vertical-align: top;
}

/* 每格整塊都能點擊 */
.notice-card {
    display: block;
    min-height: 78px;
    padding: 8px 10px;
    border: 1px solid #31516c;
    background: #10263d;
    background: rgba(16, 38, 61, 0.92);
    color: #eef7ff;
    text-decoration: none;
    line-height: 1.4;
    word-wrap: break-word;
}

a.notice-card:hover,
a.notice-card:focus {
    border-color: #94dcff;
    background: #1b3d5a;
    color: #ffffff;
}

a.notice-card:focus {
    outline: 2px solid #94dcff;
}

.notice-meta {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
}

.date {
    margin-right: 6px;
    color: #b3cee6;
}

.tag {
    color: #8fe0ff;
}

.tag-ended {
    color: #b8c2cc;
}

.notice-title {
    display: block;
    font-size: 15px;
    font-weight: bold;
}

/* 尚未新增公告的預留位置 */
.notice-empty {
    border-color: #243b50;
    background: #0c1c2e;
    background: rgba(12, 28, 46, 0.75);
}

.notice-empty .tag,
.notice-empty .notice-title {
    color: #8298ad;
}

.more {
    margin: 7px 5px 2px;
    font-size: 13px;
}

.more a {
    color: #a6d9ff;
    text-decoration: none;
}

.more a:hover,
.more a:focus {
    color: #ffffff;
    text-decoration: underline;
}

/* 較窄視窗仍維持九宮格 */
@media (max-width: 600px) {
    .wrapper {
        padding: 6px;
    }

    h1 {
        font-size: 18px;
    }

    .notice-grid {
        border-spacing: 3px;
    }

    .notice-card {
        padding: 7px 6px;
    }

    .notice-title {
        font-size: 13px;
    }

    .notice-meta {
        font-size: 11px;
    }
}
</style>
</head>

<body>
<div class="wrapper">

                    </div>
                </td>

        </tbody>

</body>
</html>
