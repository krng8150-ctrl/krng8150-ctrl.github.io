<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>永翼天堂｜防具介紹</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    background:#0b0b0b;
    color:#f5f5f5;
    font-family:"Microsoft JhengHei", Arial;
}

.header{
    background:linear-gradient(to bottom,#1c1c1c,#0b0b0b);
    padding:50px 20px;
    text-align:center;
    border-bottom:1px solid #333;
}

.header h1{
    margin:0;
    color:#ffd36a;
    font-size:42px;
    letter-spacing:3px;
}

.header p{
    color:#ccc;
    margin-top:12px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 15px;
}

.box{
    background:#151515;
    border:1px solid #333;
    border-radius:10px;
    padding:25px;
    margin-bottom:25px;
}

.box h2{
    margin-top:0;
    color:#ffd36a;
    border-bottom:1px solid #333;
    padding-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:#1d1d1d;
    border:1px solid #444;
    border-radius:8px;
    padding:20px;
    text-align:center;
}

.card h3{
    margin-top:0;
    color:#ffd36a;
}

.card p{
    color:#ccc;
    line-height:1.8;
}

.btn{
    display:inline-block;
    margin-top:12px;
    padding:10px 18px;
    background:#2b2b2b;
    color:#ffd36a;
    text-decoration:none;
    border-radius:6px;
    border:1px solid #555;
}

.btn:hover{
    background:#3a3a3a;
}

.footer{
    text-align:center;
    padding:25px;
    color:#777;
    border-top:1px solid #222;
}

</style>
</head>

<body>

<div class="header">
    <h1>防具介紹</h1>
    <p>永翼天堂｜多階防具成長系統</p>
</div>

<div class="container">

    <div class="box">
        <h2>防具系列介紹</h2>

        <div class="grid">

            <div class="card">
                <h3>亞斯克雷系列</h3>

                <p>
                分為近戰、遠攻、魔法系列。<br>
                裝備可從一般階級一路提升至極系列。
                </p>

                <a class="btn" href="#">查看系列</a>
            </div>

            <div class="card">
                <h3>死亡騎士系列</h3>

                <p>
                高階進化型防具系列。<br>
                提供更強大的能力與特殊效果。
                </p>

                <a class="btn" href="#">查看系列</a>
            </div>

            <div class="card">
                <h3>狂戰鎧甲系列</h3>

                <p>
                強化輸出與生存能力。<br>
                適合高階長期養成玩家。
                </p>

                <a class="btn" href="#">查看系列</a>
            </div>

        </div>
    </div>

    <div class="box">
        <h2>防具說明</h2>

        <p style="line-height:2;color:#ccc;">
        永翼天堂防具皆採用階級成長設計。<br>
        玩家可透過打寶、製作、升階等方式持續提升裝備能力。<br><br>

        每個系列皆擁有不同方向：
        近戰、遠攻、魔法、防禦型等多種玩法。
        </p>

        <a class="btn" href="index.html">返回首頁</a>
    </div>

</div>

<div class="footer">
永翼天堂 © 2026
</div>

</body>
</html>
