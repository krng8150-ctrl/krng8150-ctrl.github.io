<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>永翼天堂｜官方網站</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    font-family:"Microsoft JhengHei",sans-serif;
    color:#ffffff;

    background:
    linear-gradient(
    rgba(5,10,25,0.25),
    rgba(5,10,25,0.72)
    ),

    url("0EEA40A4-FBCB-4CDC-BE43-D48939B227FD.png");

    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    background-attachment:fixed;

    position:relative;
}

/* =========================
   微微流光
========================= */

body::before{

    content:"";

    position:fixed;

    top:0;
    left:-40%;

    width:30%;
    height:100%;

    background:
    linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,0.02) 30%,
    rgba(170,220,255,0.18) 50%,
    rgba(255,255,255,0.02) 70%,
    transparent 100%
    );

    animation:lightMove 12s linear infinite;

    pointer-events:none;

    z-index:1;
}

@keyframes lightMove{

    0%{
        left:-40%;
    }

    100%{
        left:140%;
    }
}

/* =========================
   主內容
========================= */

.main{

    position:relative;
    z-index:5;

    width:100%;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:60px 20px;
}

.container{

    width:100%;
    max-width:1280px;

    text-align:center;
}

/* =========================
   標題
========================= */

.top-title{

    font-size:20px;

    margin-bottom:25px;

    color:#e8f5ff;

    text-shadow:
    0 0 10px rgba(120,200,255,0.8);
}

.logo{

    font-size:92px;
    font-weight:bold;

    letter-spacing:10px;

    margin-bottom:18px;

    color:#f3fbff;

    text-shadow:
    0 0 10px #ffffff,
    0 0 25px #9fd6ff,
    0 0 45px #3c84ff;
}

.sub{

    font-size:30px;

    letter-spacing:5px;

    margin-bottom:65px;

    color:#ffffff;

    text-shadow:
    0 0 12px rgba(120,200,255,0.8);
}

/* =========================
   選單
========================= */

.menu{

    width:100%;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:32px;

    max-width:1150px;

    margin:0 auto;
}

/* =========================
   天堂按鈕
========================= */

.btn{

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:88px;

    text-decoration:none;

    color:#f5fbff;

    font-size:32px;
    font-weight:bold;

    border-radius:18px;

    background:
    linear-gradient(
    to bottom,
    rgba(40,65,120,0.90),
    rgba(10,18,38,0.95)
    );

    border:1px solid rgba(200,230,255,0.95);

    box-shadow:
    0 0 22px rgba(120,180,255,0.55),
    inset 0 0 20px rgba(255,255,255,0.10);

    overflow:visible;

    transition:0.3s;

    text-shadow:
    0 0 10px rgba(130,210,255,1);
}

/* 按鈕流光 */

.btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:60%;
    height:100%;

    background:
    linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.25),
    transparent
    );

    animation:btnFlow 6s linear infinite;
}

@keyframes btnFlow{

    0%{
        left:-120%;
    }

    100%{
        left:150%;
    }
}

/* Hover */

.btn:hover{

    transform:
    translateY(-4px)
    scale(1.02);

    box-shadow:
    0 0 35px rgba(170,220,255,0.95),
    inset 0 0 30px rgba(255,255,255,0.15);
}

/* =========================
   翅膀
========================= */

.wing-left,
.wing-right{

    position:absolute;

    top:50%;

    width:78px;
    height:78px;

    transform:translateY(-50%);

    background-image:url("https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Angel_wings_white.svg/512px-Angel_wings_white.svg.png");

    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;

    filter:
    drop-shadow(0 0 10px rgba(180,220,255,1));

    pointer-events:none;
}

.wing-left{
    left:-50px;
}

.wing-right{

    right:-50px;

    transform:
    translateY(-50%)
    scaleX(-1);
}

/* =========================
   Footer
========================= */

.footer{

    margin-top:70px;

    font-size:16px;

    color:#d9edff;

    text-shadow:
    0 0 10px rgba(120,200,255,0.8);
}

/* =========================
   平板
========================= */

@media(max-width:1000px){

    .logo{
        font-size:70px;
    }

    .sub{
        font-size:22px;
    }

    .menu{

        grid-template-columns:
        repeat(2,1fr);

        max-width:760px;
    }
}

/* =========================
   手機版
========================= */

@media(max-width:640px){

    body{
        background-attachment:scroll;
    }

    .main{
        padding:40px 18px;
    }

    .top-title{
        font-size:16px;
    }

    .logo{

        font-size:54px;

        letter-spacing:4px;
    }

    .sub{

        font-size:20px;

        letter-spacing:2px;

        margin-bottom:40px;
    }

    .menu{

        grid-template-columns:1fr;

        gap:18px;

        max-width:360px;
    }

    .btn{

        min-height:72px;

        font-size:26px;
    }

    .wing-left,
    .wing-right{

        width:56px;
        height:56px;
    }

    .wing-left{
        left:-30px;
    }

    .wing-right{
        right:-30px;
    }
}

</style>
