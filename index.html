<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永翼天堂｜官方網站</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei", Arial, sans-serif;
    min-height:100vh;
    color:#eaf4ff;
    background:#07111f;
    overflow-x:hidden;
}

/* 主背景 */
.page{
    position:relative;
    min-height:100vh;
    background:
        linear-gradient(rgba(3,10,22,0.28), rgba(3,10,22,0.78)),
        url("home-bg.png");
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    overflow:hidden;
}

/* 微微流光，不是圖片上下飄 */
.page:before{
    content:"";
    position:absolute;
    top:0;
    left:-80%;
    width:45%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent 0%,
        rgba(140,200,255,0.05) 35%,
        rgba(255,255,255,0.20) 50%,
        rgba(140,200,255,0.05) 65%,
        transparent 100%
    );
    animation:lightFlow 8s ease-in-out infinite;
    pointer-events:none;
}

@keyframes lightFlow{
    0%{ left:-80%; opacity:0; }
    20%{ opacity:0.8; }
    55%{ opacity:0.5; }
    100%{ left:130%; opacity:0; }
}

/* 微粒光點 */
.page:after{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 20% 30%, rgba(120,190,255,0.18), transparent 18%),
        radial-gradient(circle at 80% 70%, rgba(180,220,255,0.12), transparent 20%),
        radial-gradient(circle at 50% 90%, rgba(255,255,255,0.10), transparent 18%);
    animation:softGlow 6s ease-in-out infinite alternate;
    pointer-events:none;
}

@keyframes softGlow{
    from{ opacity:0.35; }
    to{ opacity:0.75; }
}

.content{
    position:relative;
    z-index:2;
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:48px 20px;
}

.box{
    width:100%;
    max-width:1120px;
    text-align:center;
}

.top-title{
    font-size:20px;
    font-weight:bold;
    color:#dcecff;
    text-shadow:0 0 10px #001a33;
    margin-bottom:12px;
}

.logo{
    font-size:72px;
    font-weight:bold;
    letter-spacing:8px;
    color:#d9ecff;
    text-shadow:
        0 0 8px #ffffff,
        0 0 18px #5aa8ff,
        0 0 35px #001a44;
    margin-bottom:12px;
}

.sub{
    font-size:24px;
    letter-spacing:4px;
    color:#f4fbff;
    text-shadow:0 0 12px #002b55;
    margin-bottom:42px;
}

.menu{
    width:100%;
    max-width:980px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:18px;
}

.btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:72px;
    padding:16px 58px;
    text-decoration:none;
    font-size:22px;
    font-weight:bold;
    color:#eaf6ff;
    border-radius:14px;
    border:1px solid rgba(190,225,255,0.9);
    background:linear-gradient(
        to bottom,
        rgba(26,47,78,0.88),
        rgba(8,18,35,0.92)
    );
    box-shadow:
        0 0 14px rgba(120,190,255,0.55),
        inset 0 0 18px rgba(255,255,255,0.10);
    text-shadow:0 0 8px #2f8fff;
    overflow:hidden;
}

/* 按鈕內流光 */
.btn:before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:70%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.22),
        transparent
    );
    animation:btnLight 5s ease-in-out infinite;
}

@keyframes btnLight{
    0%{ left:-120%; }
    45%{ left:130%; }
    100%{ left:130%; }
}

/* 左右翅膀圖案 */
.btn .wing-left,
.btn .wing-right{
    position:absolute;
    font-size:25px;
    opacity:0.95;
    filter:drop-shadow(0 0 8px #8fcaff);
}

.btn .wing-left{
    left:18px;
}

.btn .wing-right{
    right:18px;
    transform:scaleX(-1);
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 0 22px rgba(150,210,255,0.9),
        inset 0 0 22px rgba(255,255,255,0.18);
}

.footer{
    margin-top:46px;
    font-size:14px;
    color:#d8eaff;
    text-shadow:0 0 8px #002244;
}

/* 平板 */
@media(max-width:900px){
    .logo{
        font-size:56px;
        letter-spacing:5px;
    }

    .sub{
        font-size:20px;
    }

    .menu{
        grid-template-columns:repeat(2, 1fr);
        max-width:680px;
    }
}

/* 手機 */
@media(max-width:560px){
    .page{
        background-position:center top;
    }

    .content{
        align-items:flex-start;
        padding:42px 16px 34px;
    }

    .top-title{
        font-size:16px;
    }

    .logo{
        font-size:42px;
        letter-spacing:3px;
        margin-top:8px;
    }

    .sub{
        font-size:18px;
        letter-spacing:2px;
        margin-bottom:32px;
    }

    .menu{
        grid-template-columns:1fr;
        gap:13px;
        max-width:360px;
    }

    .btn{
        min-height:66px;
        font-size:22px;
        padding:15px 54px;
    }

    .btn .wing-left,
    .btn .wing-right{
        font-size:24px;
    }

    .footer{
        margin-top:32px;
    }
}
</style>
</head>

            <div class="menu">

                <a class="btn" href="poly.html">

                    <span class="wing-right">🪽</span>
                </a>

                <a class="btn" href="rebirth.html">

                    <span class="wing-right">🪽</span>

                <a class="btn" href="pattern.html">
                    <span class="wing-left">🪽</span>

                </a>

                <a class="btn" href="badge.html">
                    <span class="wing-left">🪽</span>

                <a class="btn" href="weapon.html">

                <a class="btn" href="equipment.html">

                <a class="btn" href="share.html">

                <a class="btn" href="donate.html">

            </div>

            <div class="footer">© 2026 永翼天堂</div>

        </div>
    </div>
</div>

</body>
</html>
