<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei", Arial, sans-serif;
    color:#fff;
    min-height:100vh;
    background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)),
        url("https://raw.githubusercontent.com/krng8150-ctrl/krng8150-ctrl.github.io/refs/heads/main/026AF631-4F86-4F4E-B158-561B2E193C5B.png");
    background-size:cover;
    background-position:center center;
    background-attachment:fixed;
}

.main{
    min-height:100vh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
}

.box{
    width:100%;
    max-width:1200px;
    text-align:center;
}

.logo{
    font-size:72px;
    font-weight:bold;
    color:#f7d98b;
    letter-spacing:8px;
    text-shadow:0 0 10px #000,0 0 25px #000,0 0 35px #000;
    margin-bottom:12px;
}

.sub{
    font-size:24px;
    color:#fff;
    text-shadow:0 0 10px #000;
    margin-bottom:45px;
}

.menu{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
    max-width:1000px;
    margin:0 auto;
}

.btn{
    display:block;
    padding:18px 10px;
    border-radius:14px;
    text-decoration:none;
    color:#fff;
    font-size:20px;
    font-weight:bold;
    background:linear-gradient(to bottom,#e0bd55,#80601a);
    border:2px solid #f5d67b;
    box-shadow:0 0 15px rgba(255,215,120,0.45), inset 0 0 10px rgba(255,255,255,0.28);
    text-shadow:0 0 6px #000;
}

.btn:hover{
    transform:scale(1.04);
    background:linear-gradient(to bottom,#ffe08a,#a67c22);
}

.footer{
    margin-top:45px;
    font-size:14px;
    color:#ddd;
    text-shadow:0 0 5px #000;
}

/* 平板 */
@media (max-width:900px){
    .logo{
        font-size:56px;
        letter-spacing:5px;
    }

    .sub{
        font-size:20px;
    }

    .menu{
        grid-template-columns:repeat(2, 1fr);
        max-width:620px;
    }
}

/* 手機 */
@media (max-width:520px){
    body{
        background-attachment:scroll;
    }

    .main{
        align-items:flex-start;
        padding:45px 18px;
    }

    .logo{
        font-size:42px;
        letter-spacing:3px;
    }

    .sub{
        font-size:17px;
        margin-bottom:30px;
    }

    .menu{
        grid-template-columns:1fr;
        gap:14px;
        max-width:340px;
    }

    .btn{
        font-size:18px;
        padding:15px;
    }

    .footer{
        margin-top:35px;
    }
}
