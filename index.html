<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>永翼天堂｜官方網站</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:url('https://raw.githubusercontent.com/krng8150-ctrl/krng8150-ctrl.github.io/refs/heads/main/026AF631-4F86-4F4E-B158-561B2E193C5B.png');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    min-height:100vh;
    color:white;
}

.overlay{
    width:100%;
    min-height:100vh;
    background:rgba(0,0,0,0.45);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.logo{
    font-size:58px;
    font-weight:bold;
    color:#f7d98b;
    text-shadow:
    0 0 10px #000,
    0 0 20px #000,
    0 0 30px #000;
    margin-bottom:10px;
}

.sub{
    font-size:20px;
    color:#ffffff;
    margin-bottom:50px;
    text-shadow:0 0 10px #000;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:18px;
    width:100%;
    max-width:320px;
}

.btn{
    display:block;
    width:100%;
    padding:16px;
    border-radius:14px;
    text-decoration:none;
    color:white;
    font-size:20px;
    font-weight:bold;
    background:linear-gradient(to bottom,#d4af37,#8b6b1d);
    border:2px solid #f5d67b;
    box-shadow:
    0 0 15px rgba(255,215,120,0.5),
    inset 0 0 10px rgba(255,255,255,0.3);
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
    background:linear-gradient(to bottom,#f5d67b,#a67c22);
}

.footer{
    margin-top:50px;
    font-size:14px;
    color:#cccccc;
    text-shadow:0 0 5px #000;
}

</style>
</head>

<body>

<div class="overlay">

<div class="logo">
永翼天堂
</div>

<div class="sub">
經典重生・榮耀永恆
</div>

<div class="menu">

<a class="btn" href="#">
開始遊戲
</a>

<a class="btn" href="#">

</a>

<a class="btn" href="#">

</a>

</a>

</a>

</a>

</div>

<div class="footer">

</div>

</div>
