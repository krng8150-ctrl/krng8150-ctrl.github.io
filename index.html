<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永翼天堂｜官方網站</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei", Arial, sans-serif;
    color:#ffffff;
    min-height:100vh;
    background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.70)),
        url("https://raw.githubusercontent.com/krng8150-ctrl/krng8150-ctrl.github.io/refs/heads/main/026AF631-4F86-4F4E-B158-561B2E193C5B.png");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    animation:bgMove 18s ease-in-out infinite alternate;
}

@keyframes bgMove{
    0%{
        background-size:100%;
        background-position:center center;
    }
    100%{
        background-size:112%;
        background-position:center top;
    }
}

.main{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.box{
    width:100%;
    max-width:1200px;
    text-align:center;
}

.logo{
    font-size:76px;
    font-weight:bold;
    letter-spacing:8px;
    color:#f7d98b;
    text-shadow:0 0 10px #000,0 0 20px #000,0 0 40px #000;
    margin-bottom:15px;
}

.sub{
    font-size:24px;
    color:#ffffff;
    text-shadow:0 0 10px #000;
    margin-bottom:50px;
}

.menu{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
    max-width:1050px;
    margin:0 auto;
}

.btn{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px 10px;
    text-decoration:none;
    color:#ffffff;
    font-size:20px;
    font-weight:bold;
    border-radius:16px;
    border:2px solid #f5d67b;
    background:linear-gradient(to bottom, rgba(212,175,55,0.95), rgba(110,80,18,0.95));
    box-shadow:0 0 15px rgba(255,215,120,0.45), inset 0 0 10px rgba(255,255,255,0.25);
    overflow:hidden;
    transition:0.3s;
}

.btn:before{
    content:"翼";
    position:absolute;
    left:14px;
    font-size:16px;
    color:#fff0a8;
    text-shadow:0 0 10px #fff,0 0 20px #ffd700;
}

.btn:after{
    content:"翼";
    position:absolute;
    right:14px;
    font-size:16px;
    color:#fff0a8;
    text-shadow:0 0 10px #fff,0 0 20px #ffd700;
}

.btn:hover{
    transform:scale(1.05);
    background:linear-gradient(to bottom, rgba(255,224,138,1), rgba(166,124,34,1));
    box-shadow:0 0 25px rgba(255,215,120,0.8), inset 0 0 15px rgba(255,255,255,0.45);
}

.footer{
    margin-top:55px;
    font-size:14px;
    color:#dddddd;
    text-shadow:0 0 5px #000;
}

@media(max-width:900px){
    .logo{
        font-size:58px;
        letter-spacing:5px;
    }

    .sub{
        font-size:20px;
    }

    .menu{
        grid-template-columns:repeat(2,1fr);
        max-width:650px;
    }
}

@media(max-width:520px){
    body{
        background-attachment:scroll;
    }

    .main{
        align-items:flex-start;
        padding:45px 18px;
    }

    .logo{
        font-size:42px;
        letter-spacing:3px;
    }

    .sub{
        font-size:17px;
        margin-bottom:35px;
    }

    .menu{
        grid-template-columns:1fr;
        gap:14px;
        max-width:340px;
    }

    .btn{
        font-size:18px;
        padding:16px;
    }

    .footer{
        margin-top:35px;
    }
}
</style>
</head>

<body>

<div class="main">
    <div class="box">

        <div class="logo">永翼天堂</div>
        <div class="sub">經典重生・榮耀再臨</div>

        <div class="menu">
            <a class="btn" href="notice.html">最新公告</a>
            <a class="btn" href="intro.html">遊戲介紹</a>
            <a class="btn" href="download.html">遊戲下載</a>
            <a class="btn" href="poly.html">天M變身</a>
            <a class="btn" href="rebirth.html">轉生系統</a>
            <a class="btn" href="pattern.html">紋樣系統</a>
            <a class="btn" href="badge.html">徽章系統</a>
            <a class="btn" href="weapon.html">武器介紹</a>
            <a class="btn" href="equipment.html">裝備介紹</a>
            <a class="btn" href="share.html">推文獎勵</a>
            <a class="btn" href="donate.html">贊助系統</a>
        </div>

        <div class="footer">© 2026 永翼天堂</div>

    </div>
</div>

</body>
</html>
