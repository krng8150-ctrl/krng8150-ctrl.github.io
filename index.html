<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>永翼天堂｜官方網站</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei", Arial, sans-serif;
    overflow-x:hidden;
    background:#050b16;
    color:#ffffff;
}

/* =========================
   主背景
========================= */

.page{
    position:relative;
    min-height:100vh;

    background:
    linear-gradient(
    rgba(3,10,22,0.22),
    rgba(3,10,22,0.78)
    ),

    url("0EEA40A4-FBCB-4CDC-BE43-D48939B227FD.png")

    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;

    overflow:hidden;
}

/* =========================
   微微流光效果
========================= */

.page:before{
    content:"";

    position:absolute;

    top:0;
    left:-60%;

    width:40%;
    height:100%;

    background:
    linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,0.03) 30%,
    rgba(180,220,255,0.18) 50%,
    rgba(255,255,255,0.03) 70%,
    transparent 100%
    );

    animation:lightFlow 10s linear infinite;

    pointer-events:none;
}

@keyframes lightFlow{

    0%{
        left:-60%;
    }

    100%{
        left:130%;
    }
}

/* =========================
   漂浮光粒
========================= */

.page:after{
    content:"";

    position:absolute;

    inset:0;

    background:
    radial-gradient(circle at 20% 30%, rgba(160,210,255,0.16), transparent 20%),
    radial-gradient(circle at 80% 60%, rgba(255,255,255,0.08), transparent 20%),
    radial-gradient(circle at 50% 90%, rgba(120,180,255,0.10), transparent 20%);

    animation:glowFloat 6s ease-in-out infinite alternate;

    pointer-events:none;
}

@keyframes glowFloat{

    from{
        opacity:0.35;
    }

    to{
        opacity:0.75;
    }
}

/* =========================
   主內容
========================= */

.content{
    position:relative;
    z-index:5;

    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:60px 20px;
}

.main-box{
    width:100%;
    max-width:1200px;

    text-align:center;
}

/* =========================
   標題
========================= */

.top-title{
    font-size:20px;
    color:#dcecff;
    margin-bottom:20px;

    text-shadow:
    0 0 10px #001933;
}

.logo{
    font-size:88px;
    font-weight:bold;

    letter-spacing:10px;

    color:#eaf5ff;

    text-shadow:
    0 0 10px #ffffff,
    0 0 20px #89c7ff,
    0 0 40px #003b75;

    margin-bottom:20px;
}

.sub{
    font-size:28px;

    letter-spacing:5px;

    color:#f5fbff;

    margin-bottom:55px;

    text-shadow:
    0 0 10px #002a55;
}

/* =========================
   選單排列
========================= */

.menu{
    width:100%;

    display:grid;

    grid-template-columns:
    repeat(3, 1fr);

    gap:28px;

    max-width:1100px;

    margin:0 auto;
}

/* =========================
   天堂按鈕
========================= */

.btn{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    min-height:78px;

    padding:18px 55px;

    text-decoration:none;

    font-size:28px;
    font-weight:bold;

    color:#eaf5ff;

    border-radius:18px;

    border:1px solid rgba(200,230,255,0.9);

    background:
    linear-gradient(
    to bottom,
    rgba(30,48,78,0.88),
    rgba(10,20,35,0.94)
    );

    box-shadow:
    0 0 18px rgba(130,190,255,0.55),
    inset 0 0 20px rgba(255,255,255,0.10);

    overflow:visible;

    transition:0.3s;

    text-shadow:
    0 0 10px #58aaff;
}

/* 按鈕流光 */

.btn:before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:70%;
    height:100%;

    background:
    linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.18),
    transparent
    );

    animation:btnLight 6s linear infinite;
}

@keyframes btnLight{

    0%{
        left:-120%;
    }

    100%{
        left:130%;
    }
}

/* =========================
   左右翅膀
========================= */

.btn .wing-left,
.btn .wing-right{

    position:absolute;

    width:72px;
    height:72px;

    top:50%;

    transform:translateY(-50%);

    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;

    filter:
    drop-shadow(0 0 10px #9ed0ff);

    pointer-events:none;
}

.btn .wing-left{

    left:-42px;

    background-image:url("wing-left.png");
}

.btn .wing-right{

    right:-42px;

    background-image:url("wing-left.png");

    transform:
    translateY(-50%)
    scaleX(-1);
}

/* Hover */

.btn:hover{

    transform:
    translateY(-3px)
    scale(1.02);

    box-shadow:
    0 0 28px rgba(160,220,255,0.95),
    inset 0 0 25px rgba(255,255,255,0.18);
}

/* =========================
   底部
========================= */

.footer{

    margin-top:60px;

    font-size:15px;

    color:#d7eaff;

    text-shadow:
    0 0 8px #001933;
}

/* =========================
   平板
========================= */

@media(max-width:1000px){

    .logo{
        font-size:68px;
    }

    .sub{
        font-size:22px;
    }

    .menu{
        grid-template-columns:
        repeat(2,1fr);

        max-width:760px;
    }
}

/* =========================
   手機版
========================= */

@media(max-width:600px){

    .content{
        align-items:flex-start;

        padding:40px 18px;
    }

    .top-title{
        font-size:16px;
    }

    .logo{
        font-size:48px;

        letter-spacing:4px;
    }

    .sub{
        font-size:18px;

        letter-spacing:2px;

        margin-bottom:35px;
    }

    .menu{
        grid-template-columns:1fr;

        gap:18px;

        max-width:360px;
    }

    .btn{

        min-height:68px;

        font-size:24px;

        padding:15px 50px;
    }

    .btn .wing-left,
    .btn .wing-right{

        width:58px;
        height:58px;
    }

    .btn .wing-left{
        left:-30px;
    }

    .btn .wing-right{
        right:-30px;
    }

    .footer{
        margin-top:35px;
    }
}

</style>
